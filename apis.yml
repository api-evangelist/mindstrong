name: Mindstrong
description: >-
  Mindstrong (Mindstrong Health) was a digital mental health company backed by
  General Catalyst that combined a virtual behavioral-health care team with a
  research program in "digital biomarkers" — passively measuring cognition and
  mood from smartphone interaction patterns. The company wound down its consumer
  care operations around 2023. It never published a public developer API,
  documentation portal, or API reference; its primary domains no longer serve a
  live site. The one first-party software artifact located is a Python research
  library (digital biomarker model fitting) published to PyPI by the company's
  data science team. This profile is retained in the API Evangelist network as an
  enriched company record with no public API surface.
